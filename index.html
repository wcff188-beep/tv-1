<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Prayer Clock - Masjid Darussalam Al-Amin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .tv-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 30px;
        }
        .header-masjid {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 8px;
            z-index: 10;
        }
        .header-masjid h1 {
            font-size: 28px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .header-masjid p {
            font-size: 16px;
            color: #ecf0f1;
        }
        .slideshow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .slide-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slide-img.active {
            opacity: 1;
        }
        .overlay-dark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .clock-box {
            font-size: 65px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
        }
        .date-box {
            text-align: right;
        }
        .date-masehi {
            font-size: 22px;
            font-weight: bold;
            color: #f39c12;
        }
        .date-hijriah {
            font-size: 18px;
            color: #bdc3c7;
        }
        .info-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }
        .prayer-schedule-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            text-align: center;
        }
        .prayer-card {
            flex: 1;
            background: rgba(30, 39, 46, 0.85);
            border-radius: 8px;
            padding: 10px 5px;
            border: 1px solid #485460;
            transition: all 0.3s ease;
        }
        .prayer-card.active {
            background: linear-gradient(135deg, #f39c12, #e67e22) !important;
            border-color: #d35400 !important;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.4);
        }
        .prayer-name {
            font-size: 16px;
            color: #ecf0f1;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .prayer-time {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }
        .running-text-container {
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px;
            overflow: hidden;
            white-space: nowrap;
            border-radius: 4px;
            font-size: 16px;
            color: #f1c40f;
        }
        .running-text {
            display: inline-block;
            animation: marquee 50s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <!-- Background Slideshow -->
    <div class="slideshow-container" id="slideshowContainer">
        <div class="overlay-dark"></div>
    </div>

    <div class="tv-container">
        <!-- Header Masjid -->
        <div class="header-masjid">
            <h1 id="namaMasjidDisplay">Masjid Darussalam Al-Amin</h1>
            <p id="lokasiDisplay">Kel. Kalibaru, Kec. Cilincing, Jakarta Utara</p>
        </div>

        <!-- Jam & Tanggal -->
        <div class="main-content">
            <div class="clock-box" id="liveClock">00:00:00</div>
            <div class="date-box">
                <div class="date-masehi" id="dateMasehi">-</div>
                <div class="date-hijriah" id="dateHijriah">-</div>
            </div>
        </div>

        <!-- Info Bar -->
        <div class="info-bar">
            <span id="nextPrayerInfo">Menuju Waktu Salat</span>
            <span id="ramadhanInfo">Masjid Darussalam Al-Amin</span>
        </div>

        <!-- Jadwal Salat -->
        <div class="prayer-schedule-bar">
            <div class="prayer-card" id="card-imsak">
                <div class="prayer-name">Imsak</div>
                <div class="prayer-time" id="time-imsak">--:--</div>
            </div>
            <div class="prayer-card" id="card-subuh">
                <div class="prayer-name">Subuh</div>
                <div class="prayer-time" id="time-subuh">--:--</div>
            </div>
            <div class="prayer-card" id="card-syuruq">
                <div class="prayer-name">Syuruq</div>
                <div class="prayer-time" id="time-syuruq">--:--</div>
            </div>
            <div class="prayer-card" id="card-zuhur">
                <div class="prayer-name">Zuhur</div>
                <div class="prayer-time" id="time-zuhur">--:--</div>
            </div>
            <div class="prayer-card" id="card-asar">
                <div class="prayer-name">Asar</div>
                <div class="prayer-time" id="time-asar">--:--</div>
            </div>
            <div class="prayer-card" id="card-magrib">
                <div class="prayer-name">Magrib</div>
                <div class="prayer-time" id="time-magrib">--:--</div>
            </div>
            <div class="prayer-card" id="card-isya">
                <div class="prayer-name">Isya</div>
                <div class="prayer-time" id="time-isya">--:--</div>
            </div>
        </div>

        <!-- Running Text -->
        <div class="running-text-container">
            <div class="running-text" id="runningTextContent">
                Ikuti kajian rutin setiap hari kamis ba'da zuhur di Masjid Darussalam Al-Amin.
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const liveClock = document.getElementById("liveClock");
            const dateMasehi = document.getElementById("dateMasehi");
            const dateHijriah = document.getElementById("dateHijriah");
            const namaMasjidDisplay = document.getElementById("namaMasjidDisplay");
            const lokasiDisplay = document.getElementById("lokasiDisplay");
            const slideshowContainer = document.getElementById("slideshowContainer");
            const runningTextContent = document.getElementById("runningTextContent");

            let appData = {};
            let currentSlideIndex = 0;
            let slideshowInterval = null;
            let slidesImages = [];
            let currentSchedule = {
                imsak: "04:00", subuh: "04:10", syuruq: "05:30",
                zuhur: "11:40", asar: "14:50", magrib: "17:45", isya: "19:00"
            };

            async function fetchData() {
                if (!CONFIG || !CONFIG.API_URL) return;
                try {
                    let response = await fetch(CONFIG.API_URL + "?action=getData");
                    let result = await response.json();
                    if (result.status === "success") {
                        appData = result.data;
                        updateUIFromDatabase();
                    }
                } catch (error) {
                    console.error("Gagal mengambil data:", error);
                }
            }

            function updateUIFromDatabase() {
                if (appData.PENGATURAN) {
                    appData.PENGATURAN.forEach(item => {
                        if (item.kunci === "nama_masjid" && namaMasjidDisplay) namaMasjidDisplay.innerText = item.nilai;
                        if (item.kunci === "lokasi" && lokasiDisplay) lokasiDisplay.innerText = item.nilai;
                    });
                }

                if (appData.ALARM) {
                    appData.ALARM.forEach(item => {
                        if (item.kunci === "running_text" && runningTextContent) {
                            runningTextContent.innerText = item.nilai;
                        }
                    });
                }

                if (appData.JADWAL_SHOLAT && appData.JADWAL_SHOLAT.length > 0) {
                    let now = new Date();
                    let todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                    let schedule = appData.JADWAL_SHOLAT.find(s => s.tanggal && String(s.tanggal).split('T')[0].trim() === todayStr);
                    if (schedule) currentSchedule = schedule;
                }

                function cleanTime(val) {
                    if (!val) return "--:--";
                    let s = String(val).trim();
                    if (s.includes('T')) s = s.split('T')[1];
                    return s.substring(0, 5);
                }

                document.getElementById("time-imsak").innerText = cleanTime(currentSchedule.imsak);
                document.getElementById("time-subuh").innerText = cleanTime(currentSchedule.subuh);
                document.getElementById("time-syuruq").innerText = cleanTime(currentSchedule.syuruq);
                document.getElementById("time-zuhur").innerText = cleanTime(currentSchedule.zuhur);
                document.getElementById("time-asar").innerText = cleanTime(currentSchedule.asar);
                document.getElementById("time-magrib").innerText = cleanTime(currentSchedule.magrib);
                document.getElementById("time-isya").innerText = cleanTime(currentSchedule.isya);

                if (appData.SLIDESHOW) {
                    let activeSlides = appData.SLIDESHOW.filter(s => String(s.aktif).toLowerCase() === "true");
                    if (activeSlides.length > 0) {
                        slidesImages = activeSlides.map(s => s.url_foto);
                        initSlideshow();
                    }
                }
            }

            function timeToMinutes(tStr) {
                if (!tStr) return 0;
                let clean = String(tStr);
                if (clean.includes('T')) clean = clean.split('T')[1];
                let parts = clean.split(':');
                return parseInt(parts[0] || 0) * 60 + parseInt(parts[1] || 0);
            }

            function updateActivePrayerHighlight() {
                const now = new Date();
                let currentMinutes = now.getHours() * 60 + now.getMinutes();

                let prayerKeys = ['imsak', 'subuh', 'syuruq', 'zuhur', 'asar', 'magrib', 'isya'];
                let prayers = prayerKeys.map(k => ({
                    id: k,
                    time: timeToMinutes(currentSchedule[k])
                }));

                let activeId = 'isya';
                for (let i = prayers.length - 1; i >= 0; i--) {
                    if (currentMinutes >= prayers[i].time) {
                        activeId = prayers[i].id;
                        break;
                    }
                    if (i === 0 && currentMinutes < prayers[0].time) {
                        activeId = 'isya';
                    }
                }

                prayerKeys.forEach(p => {
                    let el = document.getElementById(`card-${p}`);
                    if (el) el.classList.remove('active');
                });

                let activeCard = document.getElementById(`card-${activeId}`);
                if (activeCard) activeCard.classList.add('active');

                if (dateHijriah && currentSchedule.magrib) {
                    let magribMinutes = timeToMinutes(currentSchedule.magrib);
                    let hijriDateObj = new Date();
                    if (currentMinutes >= magribMinutes) {
                        hijriDateObj.setDate(hijriDateObj.getDate() + 1);
                    }
                    try {
                        let options = { calendar: 'islamic-umalqura', day: 'numeric', month: 'long', year: 'numeric' };
                        dateHijriah.innerText = new Intl.DateTimeFormat('id-ID-u-ca-islamic-umalqura', options).format(hijriDateObj);
                    } catch (e) {
                        dateHijriah.innerText = "";
                    }
                }
            }

            function updateClock() {
                const now = new Date();
                if (liveClock) {
                    liveClock.innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                }
                if (dateMasehi) {
                    dateMasehi.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                }
                updateActivePrayerHighlight();
            }

            function initSlideshow() {
                if (!slideshowContainer) return;
                slideshowContainer.querySelectorAll('.slide-img').forEach(img => img.remove());
                slidesImages.forEach((url, index) => {
                    let img = document.createElement("img");
                    img.src = url;
                    img.className = `slide-img ${index === 0 ? 'active' : ''}`;
                    slideshowContainer.appendChild(img);
                });
                if (slideshowInterval) clearInterval(slideshowInterval);
                slideshowInterval = setInterval(() => {
                    const imgs = slideshowContainer.querySelectorAll('.slide-img');
                    if (imgs.length === 0) return;
                    imgs[currentSlideIndex].classList.remove('active');
                    currentSlideIndex = (currentSlideIndex + 1) % imgs.length;
                    imgs[currentSlideIndex].classList.add('active');
                }, 7000);
            }

            setInterval(updateClock, 1000);
            updateClock();
            fetchData();
            setInterval(fetchData, 60000);
        });
    </script>
</body>
</html>
