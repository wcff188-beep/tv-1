<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Prayer Clock</title>
    <link rel="stylesheet" href="css/style.css?v=20261102">
</head>
<body>
    <div class="slideshow-container" id="slideshowContainer"></div>

    <div class="tv-container">
        <!-- Top Bar (Header Putih) -->
        <div class="top-bar">
            <div class="top-left">
                <div class="clock-display" id="liveClock">00:00</div>
            </div>
            <div class="divider"></div>
            <div class="top-center">
                <h1 id="namaMasjidDisplay">Masjid Darussalam Al-Amin</h1>
                <p id="lokasiDisplay">Kel. Kalibaru, Kec. Cilincing, Jakarta Utara</p>
            </div>
            <div class="divider"></div>
            <div class="top-right">
                <div class="date-masehi" id="dateMasehi">-</div>
                <div class="date-hijriah" id="dateHijriah">-</div>
            </div>
        </div>

        <!-- Ruang Kosong Tengah untuk Background -->
        <div class="spacer"></div>

        <!-- Info Bar (Countdown) -->
        <div class="info-bar">
            <div class="info-left" id="countdownSalat">Menuju Salat --:--:--</div>
            <div class="info-right" id="infoTambahan">Masjid Darussalam Al-Amin</div>
        </div>

        <!-- Jadwal Salat Bawah -->
        <div class="schedule-table">
            <div class="schedule-col" id="col-imsak">
                <div class="sched-header bg-imsak">Imsak</div>
                <div class="sched-time" id="time-imsak">--:--</div>
            </div>
            <div class="schedule-col" id="col-subuh">
                <div class="sched-header bg-subuh">Subuh</div>
                <div class="sched-time" id="time-subuh">--:--</div>
            </div>
            <div class="schedule-col" id="col-syuruq">
                <div class="sched-header bg-syuruq">Syuruq</div>
                <div class="sched-time" id="time-syuruq">--:--</div>
            </div>
            <div class="schedule-col" id="col-zuhur">
                <div class="sched-header bg-zuhur">Dzuhur</div>
                <div class="sched-time" id="time-zuhur">--:--</div>
            </div>
            <div class="schedule-col" id="col-asar">
                <div class="sched-header bg-asar">Ashar</div>
                <div class="sched-time" id="time-asar">--:--</div>
            </div>
            <div class="schedule-col" id="col-magrib">
                <div class="sched-header bg-magrib">Maghrib</div>
                <div class="sched-time" id="time-magrib">--:--</div>
            </div>
            <div class="schedule-col" id="col-isya">
                <div class="sched-header bg-isya">Isya</div>
                <div class="sched-time" id="time-isya">--:--</div>
            </div>
        </div>

        <!-- Running Text -->
        <div class="running-text-container">
            <div class="running-text" id="runningTextContent">
                Ikuti kajian rutin setiap hari kamis ba'da zuhur di Masjid Darussalam Al-Amin.
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/display.js?v=20261102"></script>
</body>
</html>
